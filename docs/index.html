<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갈아타기 모니터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e4e8ee; --text:#1b2330; --muted:#5a6472;
    --blue:#2563eb; --blue-soft:#eff5ff; --up:#e0342b; --down:#1d62d6; --amber:#b45309;
    --green:#047857; --green-soft:#ecfdf5; --red-soft:#fef2f2; --amber-soft:#fffbeb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11151c; --card:#171d26; --line:#28303c; --text:#eef2f8; --muted:#a2aebd;
      --blue-soft:#15243d; --green-soft:#0e2a22; --red-soft:#2d1717; --amber-soft:#2b2110; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-size:18px;line-height:1.62;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 16px 14px}
  header h1{margin:0 0 4px;font-size:23px;letter-spacing:-.4px}
  header p{margin:0;font-size:14.5px;opacity:.92}
  .nav{position:sticky;top:0;z-index:9;background:var(--bg);display:flex;gap:8px;overflow-x:auto;
    padding:10px 12px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--text);
    border-radius:22px;padding:9px 16px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
  .nav button.on{background:var(--blue);color:#fff;border-color:transparent}
  .wrap{max-width:960px;margin:0 auto;padding:14px 16px 60px}
  .wrap>section{display:none}
  .wrap>section.active{display:block;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:20px}
  .hint{font-size:14.5px;color:var(--muted);margin:0}
  .sig{display:flex;gap:16px;align-items:center;margin-bottom:14px}
  .sig .dot{font-size:46px;line-height:1}
  .sig .txt b{display:block;font-size:20px;margin-bottom:3px}
  .sig.green{background:var(--green-soft);border-color:#a7f3d0}
  .sig.red{background:var(--red-soft);border-color:#fecaca}
  .sig.amber{background:var(--amber-soft);border-color:#fde68a}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:16px;margin-top:12px}
  .kv .k{color:var(--muted);white-space:nowrap}
  .gauge{position:relative;height:30px;border-radius:15px;margin:10px 0 6px;
    background:linear-gradient(90deg,#dbeafe,#fde68a,#bbf7d0)}
  .gauge i{position:absolute;top:-4px;width:5px;height:38px;background:var(--text);border-radius:2px}
  .gauge span{position:absolute;top:36px;font-size:13px;color:var(--muted)}
  .ptabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
  .ptab{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;
    padding:8px 15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .ptab.on{background:var(--text);color:var(--card);border-color:transparent}
  .seg{display:inline-flex;border:1.5px solid var(--blue);border-radius:20px;overflow:hidden;margin:2px 0}
  .seg button{border:0;background:var(--card);color:var(--blue);padding:8px 20px;font-size:15.5px;
    font-weight:800;font-family:inherit;cursor:pointer}
  .seg button.on{background:var(--blue);color:#fff}
  .relay{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .relay .row{display:grid;grid-template-columns:128px 1fr 66px;gap:10px;align-items:center;font-size:16px}
  .relay .bar{height:19px;border-radius:6px;background:#e8edf4;position:relative;overflow:hidden}
  @media (prefers-color-scheme: dark){ .relay .bar{background:#222a36} }
  .relay .bar i{position:absolute;top:0;bottom:0;background:var(--blue);border-radius:6px}
  .relay .bar i.neg{background:#94a3b8}
  .relay .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .relay .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:12px;padding:2px 7px;border-radius:9px;margin-left:4px;vertical-align:1px}
  .tag.mine{background:#dbeafe;color:#1e40af} .tag.tgt{background:#fef3c7;color:#92400e}
  .tag.lead{background:#ede9fe;color:#5b21b6}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .stat{background:var(--blue-soft);border-radius:13px;padding:13px 8px;text-align:center}
  .stat .l{font-size:13px;color:var(--muted);word-break:keep-all;line-height:1.35}
  .stat .n{font-size:28px;font-weight:800;letter-spacing:-.6px}
  .stat .n small{font-size:14px;font-weight:700}
  canvas{width:100%;display:block;touch-action:pan-y}
  .legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .legend button{border:1.5px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:20px;padding:6px 12px;font-size:14.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .legend button.on{color:#fff;border-color:transparent}
  .picker{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0}
  .pick{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;
    padding:7px 13px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
  .pick.on{background:var(--blue);color:#fff;border-color:transparent}
  table{width:100%;border-collapse:collapse;font-size:15.5px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--muted);font-size:13px;font-weight:700}
  td:first-child,th:first-child{text-align:left}
  .pos{color:var(--up);font-weight:700}.neg{color:var(--down);font-weight:700}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:8px 16px 34px;max-width:960px;margin:0 auto}
  .err{background:var(--red-soft);border:1px solid #fecaca;color:#b91c1c;border-radius:14px;padding:16px;font-size:15.5px}
  .warn{color:var(--amber);font-weight:700;margin:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>🏠 갈아타기 모니터</h1>
  <p id="sub">자료 불러오는 중…</p>
</header>
<div id="navSlot"></div>
<div class="wrap" id="app"></div>
<footer>
  자료: 국토교통부 실거래가 (공공데이터포털) · 해제된 거래와 월세는 뺐습니다.<br>
  참고용 지표입니다. 실제 매매 결정은 대출·세금·실거주 조건과 함께 판단하세요.
</footer>

<script>
const COLORS = ['#2563eb','#e0342b','#047857','#b45309','#7c3aed','#0891b2','#be185d','#4d7c0f','#475569','#db2777','#0d9488','#9333ea'];
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const num = (v, d = 2) => v == null ? '—' : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => v == null ? '—' : (v > 0 ? '+' : '') + v + '%';
const cls = v => v == null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const tagOf = (S, n) => (S.내쪽목록 || []).includes(n) ? '<span class="tag mine">내 쪽</span>'
  : (S.목표쪽목록 || []).includes(n) ? '<span class="tag tgt">목표</span>'
  : (S.선도목록 || []).includes(n) ? '<span class="tag lead">선도</span>' : '';
function fakeSeries(len) { const out = []; let v = 100; for (let i = 0; i < len; i++) { v += (Math.sin(i / 4) + 1) * 0.55; out.push(Math.round(v * 10) / 10); } return out; }
// 세그먼트(매매/전세 같은 2택) 버튼
function segment(options, cur, onChange) {
  const seg = $(`<div class="seg"></div>`);
  options.forEach(([label, val]) => {
    const b = $(`<button class="${val === cur ? 'on' : ''}">${label}</button>`);
    b.onclick = () => { [...seg.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); onChange(val); };
    seg.appendChild(b);
  });
  return seg;
}

/* ---------- 선 그래프 ---------- */
function lineChart(canvas, labels, series, opt = {}) {
  const ctx = canvas.getContext('2d');
  let hover = null;
  function draw() {
    const dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = opt.height || Math.max(240, Math.round(W * 0.52));
    canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const withData = series.filter(s => s.data.some(v => v != null));
    const live = withData.filter(s => s.on !== false);
    const P = { l: 48, r: 24, t: 10, b: 28 }, w = W - P.l - P.r, h = H - P.t - P.b;
    // 눈금은 보이는 선만이 아니라 자료가 있는 모든 선을 기준으로 정합니다 — 켜고 끌 때 눈금이 안 바뀌도록
    const vals = (opt.fixedAxis === false ? live : withData).flatMap(s => s.data.filter(v => v != null));
    if (!live.length || !vals.length) { ctx.fillStyle = '#94a3b8'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('표시할 자료가 없습니다', W / 2, H / 2); return; }
    let mn = Math.min(...vals), mx = Math.max(...vals);
    if (mn === mx) { mn -= 1; mx += 1; }
    const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
    const st = getComputedStyle(document.body);
    const X = i => P.l + (labels.length === 1 ? w / 2 : w * i / (labels.length - 1));
    const Y = v => P.t + h - h * (v - mn) / (mx - mn);
    ctx.strokeStyle = st.getPropertyValue('--line'); ctx.lineWidth = 1;
    ctx.fillStyle = st.getPropertyValue('--muted'); ctx.font = '12.5px sans-serif'; ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const v = mn + (mx - mn) * i / 4, y = Y(v);
      ctx.beginPath(); ctx.moveTo(P.l, y); ctx.lineTo(P.l + w, y); ctx.stroke();
      ctx.fillText(Number(v.toFixed(opt.digits ?? 0)).toLocaleString('ko-KR'), P.l - 7, y + 4);
    }
    ctx.textAlign = 'center';
    const step = Math.max(1, Math.ceil(labels.length / (W < 420 ? 4 : 8)));
    labels.forEach((lb, i) => { if (i % step === 0 || i === labels.length - 1) ctx.fillText(lb, X(i), P.t + h + 19); });
    live.forEach(s => {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.thick ? 3.5 : 2.5;
      // 중간에 빈 달이 있으면 끊지 않고 점선으로 자연스럽게 이어 줍니다(완전히 가상인 선은 전부 점선)
      let prevI = null;
      s.data.forEach((v, i) => {
        if (v == null) return;
        if (prevI != null) {
          const bridging = i - prevI > 1;
          ctx.setLineDash((s.dash || bridging) ? [7, 5] : []);
          ctx.beginPath(); ctx.moveTo(X(prevI), Y(s.data[prevI])); ctx.lineTo(X(i), Y(v)); ctx.stroke();
        }
        prevI = i;
      });
    });
    ctx.setLineDash([]);
    if (hover != null) {
      ctx.strokeStyle = st.getPropertyValue('--muted'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(hover), P.t); ctx.lineTo(X(hover), P.t + h); ctx.stroke();
      live.forEach(s => { const v = s.data[hover]; if (v == null) return;
        ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(X(hover), Y(v), 4.5, 0, 7); ctx.fill(); });
      const items = live.filter(s => s.data[hover] != null)
        .map(s => ({ t: s.name + ' ' + Number(s.data[hover]).toLocaleString('ko-KR') + (opt.unit || ''), c: s.color }));
      if (items.length) {
        ctx.font = '13px sans-serif'; ctx.textAlign = 'left';
        const bw = Math.max(...items.map(i2 => ctx.measureText(i2.t).width)) + 28, bh = items.length * 19 + 22;
        let bx = X(hover) + 10; if (bx + bw > W) bx = X(hover) - bw - 10;
        const by = Math.min(P.t + 4, H - bh - 4);
        ctx.fillStyle = st.getPropertyValue('--card'); ctx.strokeStyle = st.getPropertyValue('--line');
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = st.getPropertyValue('--text'); ctx.fillText(labels[hover], bx + 10, by + 16);
        items.forEach((i2, k) => { ctx.fillStyle = i2.c; ctx.fillRect(bx + 10, by + 27 + k * 19, 9, 9);
          ctx.fillStyle = st.getPropertyValue('--text'); ctx.fillText(i2.t, bx + 23, by + 35 + k * 19); });
      }
    }
  }
  const pos = e => {
    const r = canvas.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const P = 48, w = r.width - P - 24;
    hover = Math.max(0, Math.min(labels.length - 1, Math.round((x - P) / w * (labels.length - 1))));
    draw();
  };
  canvas.addEventListener('mousemove', pos);
  canvas.addEventListener('touchstart', e => { pos(e); }, { passive: true });
  canvas.addEventListener('touchmove', e => { pos(e); }, { passive: true });
  canvas.addEventListener('mouseleave', () => { hover = null; draw(); });
  addEventListener('resize', draw);
  draw();
  return { draw, series };
}

/* ---------- 상승 흐름 히트맵 (누가 먼저 오르고 누가 뒤따르나) ---------- */
const 흐름순서 = ['강남', '마용성', '과천', '판교', '수내·정자', '야탑', '구성남', '수지(수지구청역)', '광교', '수원 영통', '동탄'];
function heatColor(v, cap) {
  if (v == null) return { bg: 'transparent', fg: 'var(--muted)' };
  const t = Math.max(-1, Math.min(1, v / cap));
  const a = Math.abs(t);
  const bg = t >= 0 ? `rgba(224,52,43,${(0.10 + 0.78 * a).toFixed(3)})`
                    : `rgba(37,99,235,${(0.10 + 0.78 * a).toFixed(3)})`;
  return { bg, fg: a > 0.45 ? '#fff' : 'var(--text)' };
}
function heatmapSection(D, S) {
  let kind = '매매', g = 6;
  const grans = [['1개월', 1], ['3개월', 3], ['6개월', 6], ['1년', 12]];
  const order = 흐름순서.filter(n => D.지역.some(r => r.이름 === n))
    .concat(D.지역.map(r => r.이름).filter(n => !흐름순서.includes(n)));
  const rows = order.map(n => D.지역.find(r => r.이름 === n)).filter(Boolean);
  const card = $(`<div class="card"><h2>상승 흐름</h2>
    <p class="hint">위(강남·서울)에서 시작한 <b style="color:var(--up)">붉은 물결</b>이 아래·오른쪽으로 번져 내려오면,
      상승이 외곽으로 퍼지는 흐름입니다. 칸의 숫자는 그 기간 동안 오른 정도(%)예요.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0">
      <div class="seg1"></div><div class="seg2"></div></div>
    <div class="scroll heatwrap"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--muted);flex-wrap:wrap">
      <span>많이 내림</span>
      <span style="display:inline-block;width:22px;height:16px;border-radius:3px;background:rgba(37,99,235,.85)"></span>
      <span style="display:inline-block;width:22px;height:16px;border-radius:3px;background:rgba(37,99,235,.25)"></span>
      <span style="display:inline-block;width:22px;height:16px;border-radius:3px;border:1px solid var(--line)"></span>
      <span style="display:inline-block;width:22px;height:16px;border-radius:3px;background:rgba(224,52,43,.25)"></span>
      <span style="display:inline-block;width:22px;height:16px;border-radius:3px;background:rgba(224,52,43,.85)"></span>
      <span>많이 오름</span></div></div>`);
  card.querySelector('.seg1').appendChild(segment([['매매', '매매'], ['전세', '전세']], kind, v => { kind = v; draw(); }));
  card.querySelector('.seg2').appendChild(segment(grans.map(x => [x[0], x[1]]), g, v => { g = v; draw(); }));
  const wrap = card.querySelector('.heatwrap');
  function draw() {
    const key = kind === '매매' ? '매매시리즈' : '전세시리즈';
    const last = D.라벨.length - 1;
    const idxs = []; for (let i = last; i - g >= 0; i -= g) idxs.unshift(i);
    // 각 칸 = 그 기간 상승률(%)
    const grid = rows.map(r => { const s = r[key] || [];
      return idxs.map(i => (s[i] != null && s[i - g] != null && s[i - g] > 0) ? Math.round((s[i] / s[i - g] - 1) * 1000) / 10 : null); });
    let cap = 4; grid.forEach(row => row.forEach(v => { if (v != null) cap = Math.max(cap, Math.abs(v)); }));
    const cw = 52, nameW = 96;
    let html = `<table style="border-collapse:separate;border-spacing:3px"><tr>
      <th style="position:sticky;left:0;z-index:2;background:var(--bg);min-width:${nameW}px"></th>
      ${idxs.map(i => `<th style="min-width:${cw}px;text-align:center;font-size:12.5px">${D.라벨[i]}</th>`).join('')}</tr>`;
    rows.forEach((r, ri) => {
      html += `<tr><td style="position:sticky;left:0;z-index:1;background:var(--card);min-width:${nameW}px;font-weight:800;font-size:14.5px">${r.이름}${tagOf(S, r.이름)}</td>`;
      grid[ri].forEach(v => { const c = heatColor(v, cap);
        html += `<td style="text-align:center;padding:9px 4px;border-radius:6px;background:${c.bg};color:${c.fg};font-weight:700;font-size:13px;font-variant-numeric:tabular-nums">${v == null ? '·' : (v > 0 ? '+' : '') + v}</td>`; });
      html += `</tr>`;
    });
    html += `</table>`;
    wrap.innerHTML = html;
  }
  draw();
  return card;
}

/* ---------- 상승 릴레이 (매매/전세 + 기간 탭) ---------- */
function relaySection(D, S) {
  const periods = [['2개월', 'm2'], ['3개월', 'm3'], ['6개월', 'm6'], ['1년', 'm12'], ['3년', 'm36'], ['5년', 'm60']];
  let period = 'm6', kind = '매매';
  const card = $(`<div class="card"><h2>상승 릴레이</h2>
    <p class="hint">먼저 오른 지역이 위로 옵니다 · 각 기간 동안 가격이 몇 % 올랐는지</p>
    <div class="segwrap" style="margin:10px 0 2px"></div>
    <div class="ptabs"></div><div class="relay"></div></div>`);
  card.querySelector('.segwrap').appendChild(segment([['매매', '매매'], ['전세', '전세']], kind, v => { kind = v; draw(); }));
  const ptabs = card.querySelector('.ptabs'), body = card.querySelector('.relay');
  periods.forEach(([label, key]) => {
    const b = $(`<button class="ptab${key === period ? ' on' : ''}">${label}</button>`);
    b.onclick = () => { period = key; [...ptabs.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); draw(); };
    ptabs.appendChild(b);
  });
  function draw() {
    const metric = kind === '매매' ? '매매변화' : '전세변화';
    const rel = [...D.지역].sort((a, b) => ((b[metric] || {})[period] ?? -999) - ((a[metric] || {})[period] ?? -999));
    const mx = Math.max(1, ...rel.map(r => Math.abs((r[metric] || {})[period] ?? 0)));
    body.innerHTML = rel.map(r => { const v = (r[metric] || {})[period];
      return `<div class="row"><div class="nm">${r.이름}${tagOf(S, r.이름)}</div>
        <div class="bar"><i class="${(v ?? 0) < 0 ? 'neg' : ''}" style="width:${Math.abs(v ?? 0) / mx * 100}%"></i></div>
        <div class="v ${cls(v)}">${pct(v)}</div></div>`;
    }).join('');
  }
  draw();
  return card;
}

/* ---------- 지역 가격표 (매매/전세) ---------- */
function priceTableSection(D, S) {
  let kind = '매매';
  const cols = [['2개월', 'm2'], ['3개월', 'm3'], ['6개월', 'm6'], ['1년', 'm12'], ['3년', 'm36'], ['5년', 'm60']];
  const card = $(`<div class="card"><h2>지역 가격표</h2>
    <p class="hint">각 지역 대표 단지들의 전용 ${D.면적[0]}~${D.면적[1]}㎡ 실거래 중위 가격(억)과 기간별 상승률</p>
    <div class="segwrap" style="margin:10px 0"></div>
    <div class="scroll"><table></table></div>
    <p class="hint" style="margin-top:10px">※ 현재가는 최근 3개월 실거래 중위값입니다. 거래가 적은 달은 값이 튈 수 있어요.</p></div>`);
  card.querySelector('.segwrap').appendChild(segment([['매매', '매매'], ['전세', '전세']], kind, v => { kind = v; draw(); }));
  const table = card.querySelector('table');
  function draw() {
    const cur = kind === '매매' ? '현재매매' : '현재전세';
    const chg = kind === '매매' ? '매매변화' : '전세변화';
    const rows = [...D.지역].sort((a, b) => ((b[chg] || {}).m6 ?? -999) - ((a[chg] || {}).m6 ?? -999));
    table.innerHTML = `<tr><th>지역</th><th>현재가<br>(억)</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>` +
      rows.map(r => `<tr><td>${r.이름}${tagOf(S, r.이름)}</td>
        <td><b>${num(r[cur], 1)}</b></td>
        ${cols.map(c => { const v = (r[chg] || {})[c[1]]; return `<td class="${cls(v)}">${pct(v)}</td>`; }).join('')}</tr>`).join('');
  }
  draw();
  return card;
}

/* ---------- 단지 비교 (여러 단지 선택 · 매매/전세 · 실제가격/비율) ---------- */
function compareSection(D) {
  const T = D.두단지;
  // 갈아타기 비용 요약(고정: 내 집 → 목표)
  const summary = $(`<div class="card"><h2>내 집 → 목표 단지</h2>
    <p class="hint">${T.내집.이름} 전용 ${T.내집.면적.join('~')}㎡ · ${T.목표.이름} 전용 ${T.목표.면적.join('~')}㎡ · 최근 3개월 중위값</p>
    <div class="stats">
      <div class="stat"><div class="l">${T.내집.이름}</div><div class="n">${num(T.내집.가격, 1)}<small>억</small></div></div>
      <div class="stat"><div class="l">${T.목표.이름}</div><div class="n">${num(T.목표.가격, 1)}<small>억</small></div></div>
      <div class="stat" style="background:#eef2ff"><div class="l">필요한 추가 자금</div>
        <div class="n" style="color:var(--blue)">${num(T.필요자금, 1)}<small>억</small></div></div>
    </div>
    <p class="hint">가격차 ${num(T.가격차,2)}억 + 부대비용(목표가의 ${D.부대비용_비율}%) 약 ${num(T.부대비용,2)}억
      · 전세는 ${num(T.전세.내집,1)}억 / ${num(T.전세.목표,1)}억</p></div>`);

  // 비교 대상 목록: 내 집/목표 + 지역별 대표 단지 (매매·전세 시리즈 모두 보유)
  const catalog = [];
  catalog.push({ key: '내집', label: T.내집.이름, group: '내 집 · 목표', 매매: T.내집.시리즈, 전세: T.내집.전세시리즈 });
  catalog.push({ key: '목표', label: T.목표.이름, group: '내 집 · 목표', 매매: T.목표.시리즈, 전세: T.목표.전세시리즈 });
  D.지역.forEach(r => (r.대표단지 || []).forEach(apt => {
    catalog.push({ key: r.이름 + '·' + apt, label: apt, group: r.이름,
      매매: (r.대표단지매매 || {})[apt] || [], 전세: (r.대표단지전세 || {})[apt] || [] });
  }));

  let sel = ['내집', '목표'], kind = '매매', mode = '실제';
  const card = $(`<div class="card"><h2>단지 비교</h2>
    <p class="hint">단지들을 골라 값을 나란히 비교합니다. <b>비율</b>로 보면 맨 처음 고른 단지를 100으로 두고
      나머지가 그보다 더 올랐는지(위) 덜 올랐는지(아래)를 보여줘요 — 갈아탈 타이밍 보기 좋습니다.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0">
      <div class="seg1"></div><div class="seg2"></div>
    </div>
    <div class="cwrap"></div>
    <p class="hint warn" style="display:none">⚠ 자료가 부족한 쪽은 점선(예시)으로 표시했습니다.</p>
    <div class="pickgroups" style="margin-top:12px"></div></div>`);
  card.querySelector('.seg1').appendChild(segment([['매매', '매매'], ['전세', '전세']], kind, v => { kind = v; draw(); }));
  card.querySelector('.seg2').appendChild(segment([['실제 가격', '실제'], ['비율 비교', '비율']], mode, v => { mode = v; draw(); }));
  const groups = card.querySelector('.pickgroups'), cwrap = card.querySelector('.cwrap'), note = card.querySelector('.warn');
  const byGroup = {};
  catalog.forEach(c => (byGroup[c.group] = byGroup[c.group] || []).push(c));
  Object.entries(byGroup).forEach(([g, items]) => {
    const box = $(`<div style="margin-bottom:12px"><div class="hint" style="font-weight:800;color:var(--text);margin-bottom:6px">${g}</div><div class="picker"></div></div>`);
    const picker = box.querySelector('.picker');
    items.forEach(c => picker.appendChild($(`<button class="pick" data-key="${c.key}">${c.label}</button>`)));
    groups.appendChild(box);
  });
  const allBtns = [...groups.querySelectorAll('.pick')];
  function refreshPicker() { allBtns.forEach(b => b.classList.toggle('on', sel.includes(b.dataset.key))); }
  allBtns.forEach(b => b.onclick = () => {
    const key = b.dataset.key;
    if (sel.includes(key)) sel = sel.filter(k => k !== key);
    else { if (sel.length >= 4) sel.shift(); sel.push(key); }   // 한 번에 최대 4개
    refreshPicker(); draw();
  });
  refreshPicker();
  function draw() {
    cwrap.innerHTML = '';
    const canvas = document.createElement('canvas'); cwrap.appendChild(canvas);
    const picked = sel.map(k => catalog.find(c => c.key === k)).filter(Boolean);
    let synth = false;
    let raw = picked.map(c => { const d = (kind === '매매' ? c.매매 : c.전세) || []; const real = d.some(v => v != null);
      if (!real) synth = true; return { label: c.label, data: real ? d.slice() : fakeSeries(D.라벨.length), real }; });
    let series, opt;
    if (mode === '비율' && raw.length >= 1) {
      const base = raw[0].data;
      series = raw.map((c, i) => ({ name: c.label + (i === 0 ? ' (기준100)' : '') + (c.real ? '' : ' (예시)'),
        color: COLORS[i], dash: !c.real,
        data: c.data.map((v, t) => (v != null && base[t]) ? Math.round(v / base[t] * 1000) / 10 : null) }));
      opt = { digits: 0, unit: '', fixedAxis: false };
    } else {
      series = raw.map((c, i) => ({ name: c.label + (c.real ? '' : ' (예시)'), color: COLORS[i], dash: !c.real, data: c.data }));
      opt = { digits: 1, unit: '억', fixedAxis: false };
    }
    note.style.display = synth ? 'block' : 'none';
    lineChart(canvas, D.라벨, series, opt);
  }
  draw();
  const box = document.createElement('div');
  box.appendChild(summary); box.appendChild(card);
  return box;
}

/* ---------- 최근 거래 (매매/전세 탭) ---------- */
function recentCard(c) {
  const sale = c.최근.filter(t => t.구분 === '매매'), jeonse = c.최근.filter(t => t.구분 === '전세');
  let cur = 'sale';
  const card = $(`<div class="card"><h2>${c.이름} 최근 거래</h2>
    <div class="ptabs"><button class="ptab on" data-k="sale">매매</button><button class="ptab" data-k="jeonse">전세</button></div>
    <div class="rbody"></div></div>`);
  const tabs = [...card.querySelectorAll('.ptab')], body = card.querySelector('.rbody');
  tabs.forEach(b => b.onclick = () => { cur = b.dataset.k; tabs.forEach(x => x.classList.remove('on')); b.classList.add('on'); draw(); });
  function draw() {
    const rows = cur === 'sale' ? sale : jeonse;
    body.innerHTML = rows.length
      ? `<div class="scroll"><table><tr><th>계약일</th><th>금액(억)</th><th>전용</th><th>층</th></tr>
         ${rows.map(t => `<tr><td>${t.날짜}</td><td><b>${num(t.가격)}</b></td><td>${t.면적}</td><td>${t.층}</td></tr>`).join('')}</table></div>`
      : `<div class="err">이 조건에 맞는 ${cur === 'sale' ? '매매' : '전세'} 거래를 찾지 못했습니다.
         ${c.후보.length ? '<br><br>같은 동에서 거래된 단지: ' + c.후보.join(', ') : ''}</div>`;
  }
  draw();
  return card;
}

/* ---------- 화면 만들기 ---------- */
fetch('data.json?t=' + Date.now()).then(r => r.json()).then(render).catch(e => {
  document.getElementById('sub').textContent = '자료를 불러오지 못했습니다';
  document.getElementById('app').appendChild($(`<div class="err"><b>아직 자료가 없습니다.</b><br>
    깃허브 저장소의 <b>Actions</b> 탭에서 <b>Run workflow</b>를 한 번 눌러 주세요. 처음에는 10~20분쯤 걸립니다.<br>
    <span style="font-size:13px;opacity:.7">(${e.message})</span></div>`));
});

const NAV = [['sig', '신호'], ['flow', '상승 흐름'], ['relay', '상승릴레이'], ['ptable', '지역 가격표'], ['compare', '단지 비교'], ['recent', '최근거래']];

function render(D) {
  document.getElementById('sub').textContent =
    `${D.기준월.slice(0,4)}년 ${+D.기준월.slice(4)}월 거래까지 반영 · 갱신 ${D.갱신}`;
  const app = document.getElementById('app'), S = D.신호;
  app.innerHTML = '';

  /* 신호 */
  const kind = S.등급 === '🟢' ? 'green' : S.등급 === '🔴' ? 'red' : 'amber';
  const who = g => g == null ? '' : Math.abs(g) < 1 ? '비슷하게 움직였어요'
    : g > 0 ? `내 쪽이 ${g}%p 더 올랐어요` : `목표 쪽이 ${-g}%p 더 올랐어요`;
  const secSig = $(`<div class="card">
    <div class="sig card ${kind}" style="margin:0 0 4px">
      <div class="dot">${S.등급}</div><div class="txt"><b>${S.문구.split(' — ')[0]}</b>
      <span class="hint">${S.문구.split(' — ')[1] || ''}</span></div></div>
    <div class="kv">
      <span class="k">6개월 상승률</span><span>${S.내쪽} ${pct(S.m6)} vs ${S.목표쪽} ${pct(S.t6)} <b>${who(S.gap6)}</b></span>
      <span class="k">12개월 상승률</span><span>${S.내쪽} ${pct(S.m12)} vs ${S.목표쪽} ${pct(S.t12)} <b>${who(S.gap12)}</b></span>
      <span class="k">선도 지역</span><span>${(S.선도||[]).map(x=>`${x.이름} ${pct(x.m6)}`).join(',  ') || '—'} <span class="hint">(6개월)</span></span>
    </div>
    <p class="hint" style="margin-top:16px"><b>${S.내쪽} ÷ ${S.목표쪽} 가격 비율이 지난 ${D.기간[0].slice(0,4)}년 이후 어디쯤인지</b></p>
    <div class="gauge"><i style="left:calc(${Math.min(98, Math.max(2, S.위치 ?? 50))}% - 2px)"></i>
      <span style="left:0">0 · 목표 쪽이 비쌈</span><span style="right:0">내 쪽이 비쌈 · 100</span></div>
    <p class="hint" style="margin-top:30px">지금 <b>${S.위치 ?? '—'} / 100</b> — 오른쪽(100)에 가까울수록 내 쪽이 상대적으로 비싼 때라 갈아타기에 유리합니다.</p>
  </div>`);

  const SECTIONS = {
    sig: secSig,
    flow: heatmapSection(D, S),
    relay: relaySection(D, S),
    ptable: priceTableSection(D, S),
    compare: compareSection(D),
    recent: (() => { const w = document.createElement('div'); w.appendChild(recentCard(D.두단지.내집)); w.appendChild(recentCard(D.두단지.목표)); return w; })()
  };
  NAV.forEach(([id], i) => {
    const s = document.createElement('section'); s.id = 'sec-' + id;
    if (i === 0) s.classList.add('active');
    s.appendChild(SECTIONS[id]);
    app.appendChild(s);
  });

  document.getElementById('navSlot').innerHTML = '';
  const nav = $(`<div class="nav">${NAV.map(([id, label], i) => `<button data-id="${id}" class="${i===0?'on':''}">${label}</button>`).join('')}</div>`);
  nav.querySelectorAll('button').forEach(b => b.onclick = () => {
    nav.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    app.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById('sec-' + b.dataset.id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
  });
  document.getElementById('navSlot').appendChild(nav);
}
</script>
</body>
</html>
